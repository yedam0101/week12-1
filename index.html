const imageFolders = [

  "./asset/",
  "./",
  "./assets/",
  "../asset/",
  "../assets/",
  "./Asset/",
  "./Assets/"

];

const resolvedImages = new Map();
const uploadedImages = new Map();
const cropCache = new Map();
const imageCache = new Map();

const $ = id => document.getElementById(id);

function loadImage(src) {

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = () => resolve(img);

    img.onerror = () => reject(
      new Error("Image not found")
    );

    img.src = src;

  });

}

async function resolveImage(page) {

  const filename = bookImages[page];

  if(uploadedImages.has(filename)) {

    return uploadedImages.get(filename);

  }

  if(resolvedImages.has(filename)) {

    return resolvedImages.get(filename);

  }

  for(const folder of imageFolders) {

    const path = folder + filename;

    try {

      await loadImage(path);

      resolvedImages.set(filename,path);

      return path;

    } catch(error) {

      // 다른 폴더에서 계속 찾기

    }

  }

  throw new Error(
    "Cannot find image: "+filename
  );

}

function chooseFiles() {

  $("fileInput").click();

}

$("fileInput").addEventListener(
  "change",
  async function(event) {

    stopReading();

    const files = Array.from(event.target.files);

    files.forEach(file=>{

      if(bookImages.includes(file.name)) {

        if(uploadedImages.has(file.name)) {

          URL.revokeObjectURL(
            uploadedImages.get(file.name)
          );

        }

        uploadedImages.set(
          file.name,
          URL.createObjectURL(file)
        );

      }

    });

    cropCache.clear();
    imageCache.clear();

    $("fileStatus").textContent =
      `${uploadedImages.size} / 10개의 원본 이미지 연결 완료`;

async function showBookImage(page) {

  const image = $("bookImage");

  const currentPage = page;

  try {

    const src = await resolveImage(page);

    const item = getItems()[index];

    if(mode===2 || mode===3) return;

    if(!item || item.page!==currentPage) return;

    image.src = src;

    image.classList.remove("hidden");

    $("errorMessage").classList.add("hidden");

  } catch(error) {

    const item = getItems()[index];

    if(mode===2 || mode===3) return;

    if(!item || item.page!==currentPage) return;

    image.classList.add("hidden");

    $("errorMessage").classList.remove("hidden");

  }

}

  let src;

  try {

    src = await resolveImage(word.page);

    let img = imageCache.get(src);

    if(!img) {

      img = await loadImage(src);

      imageCache.set(src,img);

    }

    const [x,y,w,h] = word.crop;

    const sx = x*img.naturalWidth;
    const sy = y*img.naturalHeight;

    const sw = w*img.naturalWidth;
    const sh = h*img.naturalHeight;

    const canvas = document.createElement("canvas");

    canvas.width = 600;
    canvas.height = 600;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#000000";

    ctx.fillRect(0,0,600,600);

    const scale = Math.min(600/sw,600/sh);

    const dw = sw*scale;
    const dh = sh*scale;

    ctx.drawImage(
      img,
      sx,sy,sw,sh,
      (600-dw)/2,
      (600-dh)/2,
      dw,dh
    );

    const result = canvas.toDataURL(
      "image/jpeg",0.95
    );

    cropCache.set(word.name,result);

    return result;

  } catch(error) {

    // 로컬 파일에서 Canvas 추출이 제한될 경우
    // 원본 그림의 해당 부분만 SVG로 표시합니다.

    if(src) {

      const [x,y,w,h] = word.crop;

      const img = await loadImage(src);

      const width = img.naturalWidth;
      const height = img.naturalHeight;

      const canvas = document.createElement("canvas");

      canvas.width = 600;
      canvas.height = 600;

      return {
        src:src,
        crop:[x,y,w,h],
        width:width,
        height:height
      };

    }

    return "";

  }

}

function applyPicture(img,result) {

  img.style.objectFit = "contain";

  img.style.clipPath = "";

  img.style.transform = "";

  if(typeof result==="string") {

    img.src = result;

    return;

  }

  if(result && result.src) {

    img.src = result.src;

    // Canvas가 제한된 환경에서는
    // 원본 페이지 전체를 대신 표시

    img.style.objectFit = "contain";

  }

}

/* =====================================
   6. 앱 데이터
===================================== */

const sentences = story.flatMap(

  (page,pageIndex)=>page.map(

    line=>({

      text:line[0],
      ko:line[1],
      page:pageIndex

    })

  )

);

const titles = [

  "🎧 Listen to the Story",
  "📖 Read Together",
  "🪐 Listen and Repeat",
  "🔍 Find the Planet",
  "🌟 Listen Again"

];

const tips = [

  "교사용 TIP: 처음 그림책을 들을 때는 따라 읽기를 요구하지 않고, 원본 그림과 이야기의 의미에 집중하도록 도와주세요.",

  "교사용 TIP: 파란색 문장은 듣는 시간입니다. 노란색 강조 표시와 Your turn!이 나오면 유아와 함께 읽어 주세요.",

  "교사용 TIP: 원본 그림책에서 추출한 그림을 보면서 영어 단어를 듣고 따라 말해요.",

  "교사용 TIP: 영어 음성을 듣고 행성 그림을 선택하는 활동입니다. 아직 영어 글자를 읽지 못하는 유아도 참여할 수 있습니다.",

  "교사용 TIP: 그림책을 다시 들으며 익숙해진 단어와 문장을 발견하도록 해 주세요. 마지막에는 가 보고 싶은 행성에 대해 이야기해 보세요."

];

let mode = 0;
let index = 0;
let session = 0;

let voices = [];
let meaningVisible = false;

let gameOrder = [];
let gameIndex = 0;
let score = 0;
let solved = false;
let target = null;

/* =====================================
   7. 음성 읽기 기능
===================================== */

function loadVoices() {

  if(!("speechSynthesis" in window)) return;

  voices = speechSynthesis.getVoices().filter(

    voice=>voice.lang.toLowerCase().startsWith("en")

  );

  const previous = $("voice").value;

  $("voice").replaceChildren(
    new Option("English Default","")
  );

  voices.forEach((voice,i)=>{

    $("voice").appendChild(

      new Option(
        voice.name+" ("+voice.lang+")",
        i
      )

    );

  });

  if(previous!=="") {

    $("voice").value = previous;

  }

}

if("speechSynthesis" in window) {

  loadVoices();

  speechSynthesis.onvoiceschanged = loadVoices;

}

function speak(text,token=session) {

  return new Promise(resolve=>{

    if(token!==session) {

      resolve(false);

      return;

    }

    if(!("speechSynthesis" in window)) {

      $("status").textContent =
        "Chrome 또는 Edge에서 실행해 주세요.";

      resolve(false);

      return;

    }

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = Number($("rate").value);

    speech.pitch = 1.05;

    const selected = $("voice").value;

    if(selected!=="" && voices[Number(selected)]) {

      speech.voice = voices[Number(selected)];

    } else {

      const english = voices.find(
        voice=>voice.lang==="en-US"
      );

      if(english) speech.voice = english;

    }

    let finished = false;

    function finish(success) {

      if(finished) return;

      finished = true;

      clearTimeout(timeout);

      resolve(success && token===session);

    }

    const timeout = setTimeout(()=>{

      finish(false);

      if(token===session) {

        speechSynthesis.cancel();

        $("status").textContent =
          "음성을 다시 재생해 주세요.";

      }

    },Math.max(15000,text.length*250));

    speech.onend = ()=>finish(true);

    speech.onerror = ()=>{

      finish(false);

      if(token===session) {

        $("status").textContent =
          "음성을 다시 재생해 주세요.";

      }

    };

    speechSynthesis.speak(speech);

  });

}

function sleep(ms) {

  return new Promise(resolve=>setTimeout(resolve,ms));

}

function stopReading() {

  session++;

  if("speechSynthesis" in window) {

    speechSynthesis.cancel();

  }

  $("sentence").className = "";

  $("status").textContent = "Ready?";

  $("countdown").textContent = "";

}

/* =====================================
   8. 화면 표시
===================================== */

function getItems() {

  if(mode===2) {

    return words.map(word=>({

      text:word.name,
      ko:word.ko,
      word:word

    }));

  }

  return sentences;

}

function updateProgress(current,total,label) {

  $("progressText").textContent = label;

  $("progressBar").style.width =
    (current/total*100)+"%";

}

function showPageButtons(page) {

  const container = $("pageButtons");

  container.replaceChildren();

  bookImages.forEach((file,i)=>{

    const button = document.createElement("button");

    button.className =
      "pageButton"+(page===i?" active":"");

    button.textContent = i+1;

    button.onclick = ()=>goToPage(i);

    container.appendChild(button);

  });

}

function goToPage(page) {

  stopReading();

  index = sentences.findIndex(
    sentence=>sentence.page===page
  );

  render();

}

async function render() {

  const items = getItems();

  const item = items[index];

  if(!item) return;

  const currentMode = mode;
  const currentIndex = index;

  $("sentence").textContent = item.text;

  $("sentence").className = "";

  $("meaning").textContent = item.ko;

  $("meaning").classList.toggle(
    "hidden",!meaningVisible
  );

  $("countdown").textContent = "";

  $("prevButton").disabled = index===0;

  $("nextButton").textContent =
    index===items.length-1?"Finish ✓":"Next ▶";

  if(mode===2) {

    $("book").classList.add("hidden");

    $("wordPicture").classList.remove("hidden");

    $("pageButtons").classList.add("hidden");

    $("wordImage").removeAttribute("src");

    $("wordImage").alt = item.text;

    updateProgress(
      index+1,
      items.length,
      `Word ${index+1} / ${items.length}`
    );

    const result = await getPlanetImage(item.word);

    if(mode===currentMode && index===currentIndex) {

      applyPicture($("wordImage"),result);

    }

  } else {

    $("book").classList.remove("hidden");

    $("wordPicture").classList.add("hidden");

    $("pageButtons").classList.remove("hidden");

    showPageButtons(item.page);

    updateProgress(
      index+1,
      items.length,
      `Page ${item.page+1} / 10 · Sentence ${index+1} / ${items.length}`
    );

    await showBookImage(item.page);

  }

}

function changeMode(newMode) {

  stopReading();

  mode = newMode;
  index = 0;

  meaningVisible = false;

  document.querySelectorAll(".tab").forEach(

    (button,i)=>button.classList.toggle(
      "active",i===mode
    )

  );

  $("title").textContent = titles[mode];

  $("teacherTip").textContent = tips[mode];

  $("readingArea").classList.toggle(
    "hidden",mode===3
  );

  $("gameArea").classList.toggle(
    "hidden",mode!==3
  );

  if(mode===3) {

    initializeGame();

  } else {

    render();

  }

}

/* =====================================
   9. 듣고 따라 읽기
===================================== */

async function repeatTime(text,token,automatic) {

  if(token!==session) return false;

  $("sentence").className = "repeat";

  $("status").textContent = "🎤 Your turn!";

  if(!automatic) {

    $("countdown").textContent =
      "Read together!";

    return true;

  }

  const minimum = Number(
    $("repeatTime").value
  );

  const seconds = Math.max(

    minimum,

    Math.ceil(text.split(/\s+/).length*.7)+2

  );

  for(let remaining=seconds;remaining>0;remaining--) {

    if(token!==session) return false;

    $("countdown").textContent = remaining;

    await sleep(1000);

  }

  if(token!==session) return false;

  $("countdown").textContent = "";

  $("status").textContent = "⭐ Great job!";

  await sleep(650);

  return token===session;

}

async function startReading() {

  stopReading();

  if(mode===3) return;

  const token = session;

  const items = getItems();

  const interactive = mode===1 || mode===2;

  const automatic =

    !interactive ||

    $("readingMode").value==="auto";

  while(index<items.length && token===session) {

    await render();

    if(token!==session) return;

    const item = items[index];

    $("sentence").className = "listening";

    $("status").textContent = "👂 Listen!";

    const success = await speak(item.text,token);

    if(!success || token!==session) return;

    if(interactive) {

      const completed = await repeatTime(
        item.text,
        token,
        automatic
      );

      if(!completed) return;

    } else {

      const nextItem = items[index+1];

      const pageChanges =
        nextItem && nextItem.page!==item.page;

      await sleep(pageChanges?1700:800);

    }

    if(token!==session) return;

    if(!automatic) return;

    if(index===items.length-1) {

      finishActivity();

      return;

    }

    index++;

  }

}

async function repeatCurrent() {

  stopReading();

  if(mode===3) return;

  const token = session;

  const item = getItems()[index];

  $("sentence").className = "listening";

  $("status").textContent = "👂 Listen!";

  const success = await speak(item.text,token);

  if(!success || token!==session) return;

  if(mode===1 || mode===2) {

    await repeatTime(

      item.text,
      token,
      $("readingMode").value==="auto"

    );

  } else {

    $("sentence").className = "";

    $("status").textContent = "Ready?";

  }

}

function finishActivity() {

  $("sentence").className = "";

  $("status").textContent =
    "🎉 Wonderful! You did it!";

  $("countdown").textContent = "⭐⭐⭐";

  $("progressBar").style.width = "100%";

  $("nextButton").disabled = true;

}

function previous() {

  stopReading();

  $("nextButton").disabled = false;

  if(index>0) index--;

  render();

}

function next() {

  stopReading();

  if(index<getItems().length-1) {

    index++;

    if(mode===1 || mode===2) {

      startReading();

    } else {

      render();

    }

  } else {

    finishActivity();

  }

}

function restart() {

  stopReading();

  index = 0;

  $("nextButton").disabled = false;

  startReading();

}

function toggleMeaning() {

  meaningVisible = !meaningVisible;

  $("meaning").classList.toggle(
    "hidden",!meaningVisible
  );

}

/* =====================================
   10. 행성 듣고 찾기 게임
===================================== */

function shuffle(array) {

  const result = [...array];

  for(let i=result.length-1;i>0;i--) {

    const j = Math.floor(Math.random()*(i+1));

    [result[i],result[j]] =
      [result[j],result[i]];

  }

  return result;

}

function initializeGame() {

  score = 0;
  gameIndex = 0;

  const planets = [

    "Mercury",
    "Venus",
    "Earth",
    "Mars",
    "Jupiter",
    "Saturn",
    "Uranus",
    "Neptune"

  ];

  gameOrder = shuffle(

    words.filter(word=>planets.includes(word.name))

  );

  setupQuestion();

}

async function setupQuestion() {

  stopReading();

  const token = session;

  solved = false;

  $("feedback").textContent = "";

  $("choices").replaceChildren();

  $("gameNext").disabled = true;

  if(gameIndex>=gameOrder.length) {

    $("question").textContent =
      "Amazing, space explorer!";

    $("stars").textContent =
      `⭐ ${score} / ${gameOrder.length}`;

    $("feedback").textContent =
      "You found all the planets!";

    $("progressText").textContent =
      "Mission Complete!";

    $("progressBar").style.width = "100%";

    $("gameNext").textContent = "Play Again";

    $("gameNext").disabled = false;

    return;

  }

  target = gameOrder[gameIndex];

  $("gameNext").textContent = "Next Question ▶";

  $("stars").textContent = "⭐ "+score;

  $("question").textContent =
    `Can you find ${target.name}?`;

  updateProgress(

    gameIndex,
    gameOrder.length,
    `Question ${gameIndex+1} / ${gameOrder.length}`

  );

  const otherWords = shuffle(

    gameOrder.filter(
      word=>word.name!==target.name
    )

  ).slice(0,2);

  const options = shuffle([
    target,...otherWords
  ]);

  const pictures = await Promise.all(

    options.map(word=>getPlanetImage(word))

  );

  if(token!==session || mode!==3) return;

  if(pictures.some(picture=>!picture)) {

    $("feedback").textContent =
      "하단의 이미지 연결 버튼으로 사진을 선택해 주세요.";

    return;

  }

  options.forEach((word,i)=>{

    const button = document.createElement("button");

    button.className = "choice";

    button.setAttribute("aria-label",word.name);

    const img = document.createElement("img");

    img.alt = "Planet picture";

    applyPicture(img,pictures[i]);

    button.appendChild(img);

    button.onclick = ()=>checkAnswer(word,button);

    $("choices").appendChild(button);

  });

}

function readQuestion() {

  if(gameIndex>=gameOrder.length) return;

  if(!$("choices").children.length) return;

  stopReading();

  speak(`Can you find ${target.name}?`);

}

async function checkAnswer(word,button) {

  if(solved) return;

  stopReading();

  const token = session;

  if(word.name===target.name) {

    solved = true;

    score++;

    button.classList.add("correct");

    const label = document.createElement("div");

    label.className = "choiceName";

    label.textContent = word.name;

    button.appendChild(label);

    $("stars").textContent = "⭐ "+score;

    $("feedback").textContent =
      `Great job! That's ${word.name}!`;

    $("gameNext").disabled = false;

    updateProgress(

      gameIndex+1,
      gameOrder.length,
      `Question ${gameIndex+1} / ${gameOrder.length}`

    );

    await speak(
      `Great job! That's ${word.name}!`,
      token
    );

  } else {

    button.classList.add("wrong");

    $("feedback").textContent =
      "💛 Let's try again!";

    await speak("Let's try again!",token);

    if(token===session && !solved) {

      await speak(
        `Can you find ${target.name}?`,
        token
      );

    }

  }

}

async function nextQuestion() {

  if(gameIndex>=gameOrder.length) {

    initializeGame();

    return;

  }

  if(!solved) return;

  gameIndex++;

  await setupQuestion();

  if(mode!==3) return;

  if(gameIndex<gameOrder.length) {

    readQuestion();

  } else {

    speak(
      "Amazing! You found all the planets!"
    );

  }

}

/* =====================================
   11. 앱 실행
===================================== */

window.addEventListener("pagehide",()=>{

  if("speechSynthesis" in window) {

    speechSynthesis.cancel();

  }

});

changeMode(0);

</script>
